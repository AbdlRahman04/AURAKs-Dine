<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
    <style>
      html, body { min-height: 100%; margin: 0; background: #f8faf9; color: #17211b; }
      html.dark, html.dark body { background: #151a17; color: #edf4ef; color-scheme: dark; }
      html:not(.dark) { color-scheme: light; }
      #root { min-height: 100vh; }
      .boot-screen {
        display: grid; min-height: 100vh; place-content: center; justify-items: center;
        gap: 0; padding: 24px; box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 44%, rgba(22, 163, 74, .09), transparent 48%);
        font: 500 14px/1.5 Inter, system-ui, sans-serif;
      }
      .boot-mark {
        display: grid; width: 56px; height: 56px; margin-bottom: 16px; place-items: center;
        border: 1px solid rgba(22, 163, 74, .22); border-radius: 18px;
        background: rgba(22, 163, 74, .08);
      }
      .boot-spinner {
        width: 24px; height: 24px; border: 2px solid rgba(22, 163, 74, .22);
        border-top-color: #16a34a; border-radius: 50%; animation: boot-spin .85s linear infinite;
      }
      .dark .boot-spinner { border-top-color: #4ade80; }
      .boot-brand { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.025em; }
      .boot-copy { margin: 5px 0 0; color: #64746a; }
      .dark .boot-copy { color: #aab9af; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
    <title>AURAK'S Dine - Smart Ordering System</title>
    <meta name="description" content="Order your meals online from AURAK'S Dine. Skip the queue, pre-order your favorite meals, and pick them up at your convenience." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" role="status" aria-label="Loading QuickDineFlow" aria-busy="true">
        <span class="boot-mark" aria-hidden="true"><span class="boot-spinner"></span></span>
        <p class="boot-brand">QuickDineFlow</p>
        <p class="boot-copy">Getting things ready for you</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
